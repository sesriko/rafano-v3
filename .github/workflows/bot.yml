
name: RAFANO V5 + BANDAR DB
on:
  schedule:
    - cron: '0 11 * * 1-5' # 18:00 WIB Senin-Jumat
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['rafano_v5_bandar.py']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas requests -q
      - run: python rafano_v5_bandar.py
        env:
          ARJUM_API_KEY: ${{ secrets.ARJUM_API_KEY }}
      - run: |
          git config user.name "rafano-bot"
          git config user.email "bot@rafano.id"
          git add rafano.db
          git diff --staged --quiet || git commit -m "DB update OHLCV+BANDAR $(date +%Y-%m-%d) - $(sqlite3 rafano.db 'SELECT COUNT(*) FROM ohlcv') rows"
          git push
