name: RAFANO V4.18 Bot

on:
  workflow_dispatch:  # biar bisa di-run manual klik tombol
  schedule:
    - cron: '30 9 * * 1-5'  # Auto tiap Senin-Jumat 16:30 WIB (09:30 UTC) setelah market tutup

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install gspread oauth2client

      - name: Create .env from Secrets
        run: |
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "TARGET_CHAT_ID=${{ secrets.TARGET_CHAT_ID }}" >> .env
          echo "ARJUM_API_KEY=${{ secrets.ARJUM_API_KEY }}" >> .env
          echo "ITICK_TOKEN=${{ secrets.ITICK_TOKEN }}" >> .env
          echo "GSHEET_NAME=rafano-broksum" >> .env
          echo "GSHEET_CREDENTIALS=credentials.json" >> .env

      - name: Create credentials.json from Secret
        run: |
          echo '${{ secrets.GSHEET_CREDENTIALS_JSON }}' > credentials.json

      - name: Check files
        run: |
          ls -lh
          cat .env | sed 's/TOKEN=.*/TOKEN=***/' | sed 's/KEY=.*/KEY=***/'

      - name: Save top 20 saham to GSheet (anti-429)
        run: |
          python -c "
          from rafano_v3 import process_save_gsheet_request
          process_save_gsheet_request(None, None)
          print('✅ Save GSheet selesai')
          "

      - name: Commit updated cache (optional)
        run: |
          git config user.name 'rafano-bot'
          git config user.email 'bot@rafano.com'
          git add -A || true
          git diff --staged --quiet || git commit -m 'Auto update GSheet cache $(date)' || true
          git push || true
