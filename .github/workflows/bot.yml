name: rafano-bot
on:
  workflow_dispatch:
jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -r requirements.txt
      - name: Run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
          ARJUM_API_KEY: ${{ secrets.ARJUM_API_KEY }}
          ITICK_TOKEN: ${{ secrets.ITICK_TOKEN }}
        run: python rafano_v417_anti429.py
