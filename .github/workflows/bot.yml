name: RAFANO V5 DB

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 1-5'

jobs:
  update-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          pip install -r requirements.txt -q || true
          pip install yfinance pandas gspread oauth2client python-dotenv -q

      - name: Update DB (OHLCV + Broksum)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
          ARJUM_API_KEY: ${{ secrets.ARJUM_API_KEY }}
          ITICK_TOKEN: ${{ secrets.ITICK_TOKEN }}
        run: |
          python rafano_v5_full.py
          ls -lh rafano.db

      - name: Push DB to GitHub
        run: |
          git config user.name 'rafano-bot'
          git config user.email 'bot@rafano.com'
          git add rafano.db rafano_v5_full.py .github/workflows/bot.yml
          git diff --staged --quiet || git commit -m "V5 DB update $(date +%Y-%m-%d) - $(du -h rafano.db | cut -f1)"
          git push origin main

# 9. Cek file bot.yml jadi
!cat .github/workflows/bot.yml
!ls -lh .github/workflows/
