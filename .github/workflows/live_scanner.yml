name: RAFANO LIVE SCANNER 5MENIT
on:
  schedule:
    - cron: '*/5 2-8 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  live-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas requests matplotlib mplfinance pytz lxml -q
      - name: Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          wget -q https://raw.githubusercontent.com/sesriko/rafano-v3/main/rafano.db -O rafano.db || echo "no db"
          python rafano_scanner_v417.py
      - uses: actions/upload-artifact@v4
        with:
          name: charts-v417
          path: charts_v417/
          retention-days: 7
