name: RAFANO UPDATE 200 + 5D
on:
  schedule:
    - cron: '0 9 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-db:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas requests lxml pytz -q
      - env:
          ARJUM_API_KEY: ${{ secrets.ARJUM_API_KEY }}
        run: |
          python rafano_v5_600.py
          sqlite3 rafano.db "SELECT COUNT(DISTINCT symbol) FROM ohlcv;"
      - run: |
          git config user.name "rafano-bot"
          git config user.email "bot@rafano.id"
          git pull origin main --rebase || true
          git add -f rafano.db
          git commit -m "auto update $(date)" || echo "no changes"
          git push origin main
